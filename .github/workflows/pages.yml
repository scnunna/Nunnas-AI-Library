name: Deploy site to GitHub Pages

# Pages source = "GitHub Actions" (Settings -> Pages). Builds docs/ from library/ + site/ and deploys it.
on:
  push:
    branches: [main]
    paths: ["library/**", "site/**", "scripts/**", "docs/data/trending.json"]
  workflow_run:
    workflows: ["Build & maintain library"]   # the weekly refresh commits with [skip ci], so redeploy after it
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build library + site into docs/
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
